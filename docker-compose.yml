version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: vedaai-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: vedaai-redis
    ports:
      - '6379:6379'
    restart: always

volumes:
  mongo-data:
